<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Astrocyte update cost per timestep against population size</title>
<desc id="desc">Log-log plot. The host cost rises steeply with population while the device cost starts higher but rises more slowly, so the two cross near forty thousand astrocytes and the device is several times cheaper above a million.</desc>
<rect width="760" height="430" fill="#fcfcfb"/>
<line x1="78.0" y1="44" x2="78.0" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="78.0" y="392" fill="#52514e" font-size="12" text-anchor="middle">100</text>
<line x1="176.4" y1="44" x2="176.4" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="176.4" y="392" fill="#52514e" font-size="12" text-anchor="middle">1k</text>
<line x1="274.8" y1="44" x2="274.8" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="274.8" y="392" fill="#52514e" font-size="12" text-anchor="middle">10k</text>
<line x1="373.2" y1="44" x2="373.2" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="373.2" y="392" fill="#52514e" font-size="12" text-anchor="middle">100k</text>
<line x1="471.6" y1="44" x2="471.6" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="471.6" y="392" fill="#52514e" font-size="12" text-anchor="middle">1M</text>
<line x1="570.0" y1="44" x2="570.0" y2="372" stroke="#e4e3df" stroke-width="1"/>
<text x="570.0" y="392" fill="#52514e" font-size="12" text-anchor="middle">10M</text>
<line x1="78" y1="372.0" x2="570" y2="372.0" stroke="#e4e3df" stroke-width="1"/>
<text x="68" y="376.0" fill="#52514e" font-size="12" text-anchor="end">1</text>
<line x1="78" y1="290.0" x2="570" y2="290.0" stroke="#e4e3df" stroke-width="1"/>
<text x="68" y="294.0" fill="#52514e" font-size="12" text-anchor="end">10</text>
<line x1="78" y1="208.0" x2="570" y2="208.0" stroke="#e4e3df" stroke-width="1"/>
<text x="68" y="212.0" fill="#52514e" font-size="12" text-anchor="end">100</text>
<line x1="78" y1="126.0" x2="570" y2="126.0" stroke="#e4e3df" stroke-width="1"/>
<text x="68" y="130.0" fill="#52514e" font-size="12" text-anchor="end">1000</text>
<line x1="78" y1="44.0" x2="570" y2="44.0" stroke="#e4e3df" stroke-width="1"/>
<text x="68" y="48.0" fill="#52514e" font-size="12" text-anchor="end">10000</text>
<line x1="78" y1="372" x2="570" y2="372" stroke="#b4b2a9" stroke-width="1"/>
<line x1="78" y1="44" x2="78" y2="372" stroke="#b4b2a9" stroke-width="1"/>
<text x="78" y="26" fill="#0b0b0b" font-size="15" font-weight="500">Astrocyte update, microseconds per timestep</text>
<text x="324" y="416" fill="#52514e" font-size="12" text-anchor="middle">astrocytes</text>
<line x1="334.0" y1="44" x2="334.0" y2="372" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<text x="341.0" y="58" fill="#52514e" font-size="12">crossover ~40k</text>
