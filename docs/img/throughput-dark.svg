<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Astrocyte update cost per timestep against population size</title>
<desc id="desc">Log-log plot. The host cost rises steeply with population while the device cost starts higher but rises more slowly, so the two cross near forty thousand astrocytes. The three device backends lie almost on top of one another, within about ten per cent.</desc>
